# Project metadata so the code installs in editable mode with pip install -e .
# Dependencies stay pinned in requirements.txt

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "f1rag"
version = "1.0.0"
description = "F1 Race Summarizer & RAG Chatbot"
requires-python = ">=3.11"
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes (unused names), I: import order
select = ["E", "W", "F", "I"]
