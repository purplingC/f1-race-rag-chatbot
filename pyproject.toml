# Tool settings only. This project is not packaged; code lives in src/f1rag.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes (unused names), I: import order
select = ["E", "W", "F", "I"]
